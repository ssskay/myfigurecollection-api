name: tests

# The offline suite only. Tests marked `live` hit myfigurecollection.net and
# are skipped by tests/conftest.py unless you pass `-m live` — CI must never
# select them: they need the network, and hammering MFC from GitHub's
# datacenter IPs is both impolite and a good way to get the project blocked.
# Run the canary by hand (`python -m pytest -m live`) when MFC's markup moves.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python = ">=3.10"; guard the floor and the current release.
        python-version: ['3.10', '3.13']

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run offline tests
        run: python -m pytest
